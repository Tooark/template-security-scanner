# =============================================================================
# Mirror project: publishes the CI Security Scanner templates to a self-hosted
# GitLab CI/CD Catalog.
# -----------------------------------------------------------------------------
# GitHub stays the source of truth: Tooark/template-security-scanner. This
# project holds a copy of templates/ and republishes it whenever upstream cuts
# a release. Nothing is authored here.
#
# Two kinds of pipeline run, and nothing else does:
#
#   default branch   `sync` asks GitHub for the releases of upstream and, for
#                    every one that has no tag here yet, oldest first, commits
#                    its templates/ and pushes its tag. Started by the weekly
#                    schedule, by "Run pipeline", or by a push to the branch.
#   version tag      pushed by `sync`, one per release: `release` publishes it
#                    to the catalog.
#
# The weekly check needs a pipeline schedule, and that is the one thing this
# file cannot bring: GitLab keeps schedules in the project, not in the
# repository. Create it once (README.md, "One-time setup"). Without it the
# mirror only looks for a new release when someone runs the pipeline.
#
# Setup is documented in README.md next to this file.
# =============================================================================
stages:
  - sync
  - release

# -----------------------------------------------------------------------------
# What may start a pipeline here. A branch other than the default one is left
# out on purpose: `sync` pushes its commits to the default branch, and must
# never do that from the head of another one. So is a tag that is not a
# version: only `sync` creates the ones that get published.
# -----------------------------------------------------------------------------
workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^[0-9]+\.[0-9]+\.[0-9]+$/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

variables:
  UPSTREAM_REPO: "Tooark/template-security-scanner"
  UPSTREAM_API: "https://api.github.com"
  UPSTREAM_DOWNLOAD: "https://github.com"
  # Files replaced wholesale on each sync. Everything else in this project
  # (starting with this file) is local and survives.
  SYNCED_PATHS: "templates README.md LICENSE VERSION"
  GIT_DEPTH: "0"

# -----------------------------------------------------------------------------
# Pushes a tag for every upstream release that does not have one here yet.
# Looking at the newest release alone would skip a patch released in the same
# week as the next version, and never pick up a fix released later for an older
# line, leaving @1.3 behind. Re-running it when nothing changed is a no-op.
# -----------------------------------------------------------------------------
sync:
  stage: sync
  # Pinned by digest: this job holds CATALOG_PUSH_TOKEN. To bump, pick a
  # supported release (https://alpinelinux.org/releases/) and resolve its
  # digest with: docker buildx imagetools inspect alpine:<version>
  image: alpine:3.24.2@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  # One sync at a time. The schedule and someone pressing "Run pipeline" would
  # otherwise build the same commits side by side and race to push the same
  # tags; the second one now waits, and finds nothing left to publish.
  resource_group: catalog-sync
  before_script:
    - apk add --no-cache curl jq git tar
  script:
    - |
      set -eu

      if [ -z "${CATALOG_PUSH_TOKEN:-}" ]; then
        echo "CATALOG_PUSH_TOKEN is not set; see README.md" >&2
        exit 1
      fi

      if [ "${CI_PIPELINE_SOURCE:-}" != "schedule" ]; then
        echo "== started by '${CI_PIPELINE_SOURCE:-}', not by a schedule: the weekly check needs a pipeline schedule on ${CI_DEFAULT_BRANCH} (README.md, One-time setup) =="
      fi

      auth_header=""
      if [ -n "${UPSTREAM_TOKEN:-}" ]; then
        auth_header="Authorization: Bearer ${UPSTREAM_TOKEN}"
      fi

      echo "== listing the releases of ${UPSTREAM_REPO} =="
      : > /tmp/releases.json
      page=1
      while :; do
        url="${UPSTREAM_API}/repos/${UPSTREAM_REPO}/releases?per_page=100&page=${page}"
        if [ -n "$auth_header" ]; then
          body="$(curl -fsSL -H "$auth_header" "$url")"
        else
          body="$(curl -fsSL "$url")"
        fi
        printf '%s\n' "$body" >> /tmp/releases.json
        if [ "$(printf '%s' "$body" | jq 'length')" -lt 100 ]; then
          break
        fi
        page=$((page + 1))
      done

      # Published releases tagged vMAJOR.MINOR.PATCH, lowest version first,
      # compared as numbers so that 1.10.0 sorts after 1.9.0. Drafts and
      # prereleases are left out.
      upstream_tags="$(jq -rs '
        add
        | map(select((.draft or .prerelease) | not) | .tag_name
              | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")))
        | sort_by(ltrimstr("v") | split(".") | map(tonumber))
        | .[]' /tmp/releases.json)"
      if [ -z "$upstream_tags" ]; then
        echo "found no release of ${UPSTREAM_REPO} tagged vMAJOR.MINOR.PATCH" >&2
        exit 1
      fi
      newest_tag="$(printf '%s\n' "$upstream_tags" | tail -n 1)"

      # The catalog wants a bare semantic version, GitHub tags carry a v prefix.
      #
      # Listed in a step of its own: piped straight into cut, a failure of git
      # would pass for a mirror without a single tag, and every release would
      # look unpublished.
      remote_tags="$(git ls-remote --tags --refs origin)"
      published="$(printf '%s\n' "$remote_tags" | cut -f2)"
      missing=""
      for upstream_tag in $upstream_tags; do
        if ! printf '%s\n' "$published" | grep -qxF "refs/tags/${upstream_tag#v}"; then
          missing="$missing $upstream_tag"
        fi
      done

      if [ -z "$missing" ]; then
        echo "== every release up to $newest_tag is already published; nothing to do =="
        exit 0
      fi
      echo "== to publish:$missing =="

      git config user.name "${SYNC_COMMIT_NAME:-gitlab-catalog-sync}"
      git config user.email "${SYNC_COMMIT_EMAIL:-gitlab-catalog-sync@${CI_SERVER_HOST}}"

      # One commit and one tag per release, stacked in version order. Nothing
      # is pushed until all of them are built.
      for upstream_tag in $missing; do
        version="${upstream_tag#v}"
        echo "== downloading $upstream_tag -> catalog version $version =="
        rm -rf /tmp/upstream /tmp/upstream.tgz
        curl -fsSL "${UPSTREAM_DOWNLOAD}/${UPSTREAM_REPO}/archive/refs/tags/${upstream_tag}.tar.gz" -o /tmp/upstream.tgz
        mkdir -p /tmp/upstream
        tar -xzf /tmp/upstream.tgz -C /tmp/upstream --strip-components=1

        for path in $SYNCED_PATHS; do
          if [ ! -e "/tmp/upstream/$path" ]; then
            echo "upstream release is missing $path" >&2
            exit 1
          fi
          rm -rf "./$path"
          cp -r "/tmp/upstream/$path" "./$path"
          echo "  synced $path"
        done

        git add -A -- $SYNCED_PATHS
        if git diff --cached --quiet; then
          echo "  content is identical; tagging $version anyway"
        else
          git commit -q -m "chore: sync upstream ${upstream_tag}"
        fi
        git tag -a "$version" -m "ci-security-scanner ${version} (upstream ${upstream_tag})"
      done

      # The token reaches git through a credential helper instead of the remote
      # URL, so it never lands in argv (readable through /proc by anything else
      # on the runner) nor in a URL that git can echo back in an error. The
      # single quotes matter: git expands the variable when it calls the helper.
      # The empty helper in front drops any helper configured earlier, such as
      # the CI_JOB_TOKEN one the runner installs with FF_GIT_URLS_WITHOUT_TOKENS.
      push() {
        git -c credential.helper= \
          -c credential.helper='!f() { echo "username=oauth2"; echo "password=${CATALOG_PUSH_TOKEN}"; }; f' \
          push "$@"
      }

      # The runner rewrites the bare project URL to one carrying CI_JOB_TOKEN
      # (url.<with token>.insteadOf <without>), and the job token cannot push.
      # insteadOf matches the start of the URL, so the user part keeps this one
      # out of the rewrite.
      remote="https://oauth2@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"

      # The default branch follows the newest release. A fix for an older line
      # (1.3.2 once 1.4.0 is out) reaches the project through its tag alone,
      # which carries its commit.
      #
      # ci.skip: without it this push starts a branch pipeline whose own sync
      # job races the tag pushes below, and fails trying to create the same tag
      # when it wins. The tag pushes must not skip CI: their pipelines publish.
      case " $missing " in
        *" $newest_tag "*)
          push -o ci.skip "$remote" "HEAD:${CI_DEFAULT_BRANCH}"
          ;;
        *)
          echo "== $newest_tag was already published; ${CI_DEFAULT_BRANCH} stays on it =="
          ;;
      esac

      # Each tag starts the pipeline that runs the release job below. One push
      # per tag: GitLab creates pipelines for at most four refs of a single
      # push, and drops the rest without a word.
      for upstream_tag in $missing; do
        version="${upstream_tag#v}"
        push "$remote" "refs/tags/${version}"
        echo "== published tag $version; the release job takes it from here =="
      done

# -----------------------------------------------------------------------------
# Publishes the tag to the catalog. The `release` keyword is required; creating
# the release through the API does not register it as a catalog version.
# -----------------------------------------------------------------------------
release:
  stage: release
  # glab >= 1.58.0 runs the release keyword on GitLab 18.0+ (release-cli is
  # deprecated and goes away in 20.0). Pinned by digest; to bump, pick a release
  # from https://gitlab.com/gitlab-org/cli/-/releases and resolve its digest
  # with: docker buildx imagetools inspect registry.gitlab.com/gitlab-org/cli:<tag>
  image: registry.gitlab.com/gitlab-org/cli:v1.119.0@sha256:79223ad3fa6e3c3226119ac5d0b73e55f1b909e6d5bbf8469726480723b63ba8
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "Publishing $CI_COMMIT_TAG to the CI/CD Catalog"
  release:
    tag_name: $CI_COMMIT_TAG
    description: "ci-security-scanner $CI_COMMIT_TAG"
