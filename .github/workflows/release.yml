# =============================================================================
# template-security-scanner :: Release
# -----------------------------------------------------------------------------
# A release is COMPONENT_VERSION reaching main. Every push to main that touches
# VERSION asks one question: does v<COMPONENT_VERSION> already have a tag and a
# release?
#
#   yes   nothing is published. A push that only moves SCANNER_VERSION, or
#         that rewords a comment in the file, ends here.
#   no    the checks run, this commit is tagged v<COMPONENT_VERSION>, the
#         release is created with the changelog section as its notes, and the
#         floating vMAJOR and vMAJOR.MINOR tags follow.
#
# Nobody pushes a version tag: merging the pull request that bumps VERSION is
# the release. The logic lives in scripts/release.sh, which
# tests/release.test.sh plays out against a throwaway repository.
#
# Only main releases. A branch that bumps VERSION ahead of its pull request
# must not publish before the review.
#
# The tag ruleset of the repository has to let this workflow create v*.*.*
# tags; see Releasing in CONTRIBUTING.md.
# =============================================================================
name: Release

on:
  push:
    branches: [main]
    paths:
      - "VERSION"
  # Finishes a run that failed halfway: with the release already published it
  # does nothing but put the floating tags right.
  workflow_dispatch:

permissions:
  contents: write

# One release at a time, and never cancel one in flight: a run stopped between
# the release and the floating tags would leave them on the previous version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    # workflow_dispatch offers every branch; only main is ever released.
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide whether VERSION names a new release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release.sh plan

      # The checks run only when something is about to be published: what a
      # consumer pins must have passed them on the very commit it points at.
      - name: Install PyYAML
        if: steps.plan.outputs.state != 'published'
        run: python3 -m pip install --quiet pyyaml

      - name: Validate the component templates
        if: steps.plan.outputs.state != 'published'
        run: python3 scripts/validate-templates.py

      - name: Check version pinning, input wiring and docs
        if: steps.plan.outputs.state != 'published'
        run: bash scripts/check-sync.sh

      - name: Check the examples against the templates
        if: steps.plan.outputs.state != 'published'
        run: python3 scripts/check-examples.py

      - name: Test the jobs the templates generate
        if: steps.plan.outputs.state != 'published'
        run: python3 tests/templates.test.py

      - name: Test the release script
        if: steps.plan.outputs.state != 'published'
        run: bash tests/release.test.sh

      # The README and the examples of this commit are what every catalog
      # mirror publishes for the version, and a mirror never goes back to one.
      - name: Test the catalog mirror rewrite
        if: steps.plan.outputs.state != 'published'
        run: python3 tests/catalog-mirror.test.py

      - name: ShellCheck
        if: steps.plan.outputs.state != 'published'
        run: shellcheck -s bash scripts/*.sh tests/*.sh

      # Decides again rather than trusting the answer of the first step: the
      # checks take minutes, and the tags are read at the moment they matter.
      - name: Publish the release and point the floating tags at it
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release.sh publish
